server:
  port: ${PORT:8080}

logging:
  file:
    name: ${LOGGING_FILE_NAME:/tmp/stafi-backend.log}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: chat-api
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
  cors-allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*:[*],http://10.*:[*],http://172.*:[*],http://*.local:[*],https://*.vercel.app}
  supabase-jwt-issuer: ${SUPABASE_JWT_ISSUER:https://bwmxmswnarwfaemeaxeh.supabase.co/auth/v1}
  supabase-jwks-url: ${SUPABASE_JWKS_URL:https://bwmxmswnarwfaemeaxeh.supabase.co/auth/v1/.well-known/jwks.json}
  supabase-url: ${SUPABASE_URL:https://bwmxmswnarwfaemeaxeh.supabase.co}
  supabase-publishable-key: ${SUPABASE_PUBLISHABLE_KEY:${SUPABASE_ANON_KEY:${VITE_SUPABASE_PUBLISHABLE_KEY:sb_publishable_MjFtfVUu3bGzmnUJIV9InA_XGKVSYox}}}
  supabase-service-role-key: ${SUPABASE_SECRET_KEY:${SUPABASE_SERVICE_ROLE_KEY:}}
  groq-api-url: ${GROQ_API_URL:https://api.groq.com/openai/v1}
  groq-model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  groq-summarize-key: ${GROQ_SUMMARIZE_API_KEY:}
  groq-voice-key: ${GROQ_VOICE_API_KEY:}
  groq-conversation-key: ${GROQ_CONVERSATION_API_KEY:}
