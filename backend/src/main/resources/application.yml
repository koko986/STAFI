server:
  port: 8080

logging:
  file:
    name: ${LOGGING_FILE_NAME:../.runlogs/backend.log}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: chat-api
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:false}
  cors-allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*:[*],http://10.*:[*],http://172.*:[*],http://*.local:[*]}
  supabase-jwt-issuer: ${SUPABASE_JWT_ISSUER:}
  supabase-jwks-url: ${SUPABASE_JWKS_URL:}
  supabase-url: ${SUPABASE_URL:}
  supabase-service-role-key: ${SUPABASE_SECRET_KEY:${SUPABASE_SERVICE_ROLE_KEY:}}
  ai-api-url: ${AI_API_URL:${DEEPSEEK_API_URL:${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}}}
  ai-model: ${AI_MODEL:${DEEPSEEK_MODEL:${OPENAI_MODEL:gpt-4o-mini}}}
  ai-api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY:${OPENAI_API_KEY:}}}
  ai-local-api-url: ${AI_LOCAL_API_URL:http://localhost:11434/api/chat}
  ai-local-model: ${AI_LOCAL_MODEL:llama3.2}
